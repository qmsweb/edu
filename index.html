<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="لعبة تحدي الفرق: أداة للمعلم لإدارة بنوك الأسئلة والفرق وتنفيذ تحديات تفاعلية."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 7l10 5-10 5-10-5z' fill='white'/%3E%3Cpath d='M9 14.5V20c0 1.6 3.1 3.2 7 3.2s7-1.6 7-3.2v-5.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>تحدي الفرق · منصة المعلم</title>

    <!-- خطوط Google: Cairo الأساسي مع IBM Plex Sans Arabic كخط احتياطي -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- ===== الشريط العلوي مع قائمة التنقل ===== -->
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <span class="brand-mark">ت</span>
          <div class="brand-text">
            <span class="brand-title">تحدي الفرق</span>
            <span class="brand-sub">منصة المعلم التفاعلية</span>
          </div>
        </div>

        <nav class="nav" aria-label="التنقل بين الواجهات">
          <button class="nav-btn is-active" data-nav="banks" type="button">
            بنك الأسئلة
          </button>
          <button class="nav-btn" data-nav="teams" type="button">الفرق</button>
          <button class="nav-btn" data-nav="challenge" type="button">
            التحدي
          </button>
        </nav>
      </div>
    </header>

    <!-- ===== حاوية الواجهات ===== -->
    <main id="view" class="container" role="main"></main>

    <!-- ===== حوارات منبثقة وإشعارات ===== -->
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <!-- يجب تحميل الأدوات والمخزن أولاً، ثم الواجهات، ثم المشغّل الرئيسي -->
    <script src="./js/utils.js"></script>
    <script src="./js/store.js"></script>
    <script src="./js/views/banks.js"></script>
    <script src="./js/views/teams.js"></script>
    <script src="./js/views/challenge.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
